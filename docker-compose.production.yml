# Overlay: docker compose -f docker-compose.yml -f docker-compose.production.yml up
# Does not seed demo accounts. Requires DEMO_AUTH_ENABLED=false and AGENT_MODE=langgraph in env.
services:
  backend:
    environment:
      APP_ENV: production
      DEMO_AUTH_ENABLED: "false"
      AGENT_MODE: langgraph
    command: >
      sh -c "alembic upgrade head &&
             uvicorn campus247.main:app --host 0.0.0.0 --port 8000"

  worker:
    environment:
      APP_ENV: production
      DEMO_AUTH_ENABLED: "false"
      AGENT_MODE: langgraph
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
