name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    # GitHub-hosted runners are currently blocked by billing/spending limits.
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campus24_pytest
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U campus -d campus24_pytest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      AGENT_MODE: stub
      RAG_MODE: stub
      LLM_PROVIDER: openai
      OPENAI_API_KEY: test-key
      PYTHONPATH: src:..

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        # Keep caches local: Actions cache uploads were stalling job cleanup.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create isolated Python environment
        run: |
          python -m venv "$RUNNER_TEMP/campus247-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "$RUNNER_TEMP/campus247-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Check OpenAPI artifacts
        working-directory: .
        run: PYTHONPATH=backend/src python -m scripts.export_contracts_v1 --check

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          EDU14_TEST_DATABASE_URL: postgresql+psycopg://campus:campus@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/campus24_pytest

  frontend:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run regression tests
        run: npm run test:regression

      - name: Build
        run: npm run build
